services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-book-tickets-backend:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ${NGINX_IMAGE:-book-tickets-nginx:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
