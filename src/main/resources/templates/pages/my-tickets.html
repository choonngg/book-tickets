<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 티켓 | Ticket</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <a class="brand" th:href="@{/concerts}">Ticket</a>
    <nav class="nav">
        <a th:href="@{/concerts}">공연</a>
        <a th:href="@{/concerts/new}">공연 생성</a>
    </nav>
</header>
<main class="page">
    <section class="page-header">
        <h1>내 티켓</h1>
    </section>
    <p class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <section class="empty-state" th:if="${#lists.isEmpty(tickets)}">
        <strong>구매한 티켓이 없습니다.</strong>
    </section>
    <table class="data-table" th:unless="${#lists.isEmpty(tickets)}">
        <thead>
        <tr>
            <th>공연명</th>
            <th>좌석</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.concertTitle()}">공연명</td>
            <td th:text="${ticket.section()} + '-' + ${ticket.row()} + '-' + ${ticket.col()}">좌석</td>
            <td th:text="${ticket.status()}">COMPLETED</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
