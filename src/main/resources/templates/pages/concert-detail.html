<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 상세 | Ticket</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <a class="brand" th:href="@{/concerts}">Ticket</a>
    <nav class="nav">
        <a th:href="@{/concerts}">공연</a>
        <a th:href="@{/tickets/me}">내 티켓</a>
    </nav>
</header>
<main class="page">
    <section class="page-header">
        <h1>공연 상세</h1>
        <p th:text="${concert.title()}">공연명</p>
    </section>
    <p class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <section class="seat-preview" th:if="${!#lists.isEmpty(seats)}">
        <form th:each="seat : ${seats}" method="post" th:action="@{/tickets}">
            <input type="hidden" name="seatId" th:value="${seat.seatId()}">
            <button type="submit"
                    th:disabled="${seat.status().name() != 'AVAILABLE'}"
                    th:text="${seat.section()} + '-' + ${seat.row()} + ' / ' + ${seat.status()}">A-1</button>
        </form>
    </section>
</main>
</body>
</html>
