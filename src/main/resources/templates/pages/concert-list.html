<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 목록 | Ticket</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <a class="brand" th:href="@{/concerts}">Ticket</a>
    <nav class="nav">
        <a th:if="${userRole != null and userRole.name() == 'ARTIST'}" th:href="@{/concerts/new}">공연 생성</a>
        <a th:href="@{/tickets/me}">내 티켓</a>
        <a th:if="${!loggedIn}" th:href="@{/login}">로그인</a>
        <form th:if="${loggedIn}" method="post" th:action="@{/logout}">
            <button class="link-button" type="submit">로그아웃</button>
        </form>
    </nav>
</header>
<main class="page">
    <section class="page-header">
        <h1>공연 목록</h1>
    </section>
    <section class="empty-state" th:if="${#lists.isEmpty(concerts)}">
        <strong>등록된 공연이 없습니다.</strong>
    </section>
    <table class="data-table" th:unless="${#lists.isEmpty(concerts)}">
        <thead>
        <tr>
            <th>공연명</th>
            <th>장소</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="concert : ${concerts}">
            <td><a th:href="@{/concerts/{concertId}(concertId=${concert.concertId()})}" th:text="${concert.title()}">공연명</a></td>
            <td th:text="${concert.venue()}">장소</td>
            <td th:text="${concert.status()}">상태</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
