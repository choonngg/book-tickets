<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | Ticket</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <a class="brand" th:href="@{/concerts}">Ticket</a>
    <nav class="nav">
        <a th:href="@{/concerts}">공연</a>
        <a th:href="@{/login}">로그인</a>
    </nav>
</header>
<main class="page narrow">
    <section class="page-header">
        <h1>회원가입</h1>
    </section>
    <form class="panel">
        <label>이메일<input type="email" name="email" autocomplete="email"></label>
        <label>비밀번호<input type="password" name="password" autocomplete="new-password"></label>
        <label>이름<input type="text" name="name" autocomplete="name"></label>
        <label>역할
            <select name="role">
                <option value="FAN">팬</option>
                <option value="ARTIST">아티스트</option>
            </select>
        </label>
        <button type="button">회원가입</button>
    </form>
</main>
</body>
</html>
