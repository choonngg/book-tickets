<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Ticket</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <a class="brand" th:href="@{/concerts}">Ticket</a>
    <nav class="nav">
        <a th:href="@{/concerts}">공연</a>
        <a th:href="@{/signup}">회원가입</a>
    </nav>
</header>
<main class="page narrow">
    <section class="page-header">
        <h1>로그인</h1>
    </section>
    <form class="panel">
        <label>이메일<input type="email" name="email" autocomplete="email"></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password"></label>
        <button type="button">로그인</button>
    </form>
</main>
</body>
</html>
