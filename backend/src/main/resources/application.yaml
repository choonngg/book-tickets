spring:
  application:
    name: ticket
  datasource:
    url: jdbc:mysql://localhost:3306/ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: local-development-secret-key-must-be-at-least-32-bytes
  access-token-minutes: 30
  refresh-token-days: 7

ticket:
  purchase-strategy: distributed

payment:
  timeout-millis: 5000
